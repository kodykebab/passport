<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Frappe ID</title>
  <link rel="stylesheet" href="{{ ui.style | e }}">
</head>
<body>
  <div id="passport-ui"></div>

  <script type="module" src="{{ ui.script | e }}"></script>
</body>
</html>
