<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in to Frappe ID</title>
  <link rel="stylesheet" href="{{ ui.style | e }}">
</head>
<body>
  <div id="passport-ui"></div>
  <noscript>Enable JavaScript to use Frappe ID.</noscript>
  <script id="passport-data" type="application/json">{{ {'page': 'email', 'attempt': attempt, 'form_token': form_token, 'challenge': {'spent': challenge.spent, 'generation': challenge.generation} if challenge else none, 'error': error, 'destination': destination, 'password_url': password_url, 'wait': wait} | tojson }}</script>
  <script type="module" src="{{ ui.script | e }}"></script>
</body>
</html>
